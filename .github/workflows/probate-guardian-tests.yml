name: probate-guardian tests

on:
  push:
    branches: [master]
    paths:
      - 'probate-guardian/**'
      - '.github/workflows/probate-guardian-tests.yml'
  pull_request:
    paths:
      - 'probate-guardian/**'
      - '.github/workflows/probate-guardian-tests.yml'

defaults:
  run:
    working-directory: probate-guardian

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: probate-guardian/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build (web + portable)
        run: npm run build

      - name: Assemble Cloudflare Pages output
        run: node ../scripts/build-cloudflare-pages.mjs

      - name: Run unit tests
        run: npm run test:unit

      - name: Run source Playwright suite
        run: PG_TARGET=source npx playwright test

      - name: Run release-target security matrix
        shell: bash
        run: |
          for target in dev web portable; do
            PG_TARGET="$target" npx playwright test tests/e2e/security.spec.ts tests/e2e/routes.spec.ts
          done

      - name: Run hosted offline suite
        run: PG_TARGET=web npx playwright test tests/e2e/offline.spec.ts

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: probate-guardian/playwright-report/
          retention-days: 14
